name: 👾 generate pacman

on:
  schedule: # run automatically every 24 hours
    - cron: "0 15 * * *"
  workflow_dispatch: # allows to manually run the job at any time
  push: # run on every push on the master branch
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      - name: Setup git user
        run: |
          git config --global user.name "neon-aiart"
          git config --global user.email "240400715+neon-aiart@users.noreply.github.com"

      # push the content of  to a branch
      # the content will be available at https://raw.githubusercontent.com//// , or as github page
      - name: push pacman-contribution-graph.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
