name: 🗑️ Auto Camo Purge
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *' # ５分おき

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Purge Worker Cache
        run: |
          # 1. プロフィールページ（READMEが表示されている場所）のHTMLを読み込む
          PROFILE_URL="https://github.com/neon-aiart/"
          echo "Target: $PROFILE_URL..."

          # 2. HTMLを取得してURLを抽出
          CAMO_URLS=$(curl -s "$PROFILE_URL" | grep -oP 'camo.githubusercontent.com[a-f0-9/]+' | sort -u)

          if [ -z "$CAMO_URLS" ]; then
            echo "No Camo URLs found. Check if the profile is public."
            exit 0
          fi

          # 3. 重複を削除して、ひとつずつ PURGE 命令を送る
          for url in $CAMO_URLS; do
            echo "Purging: $url"
            curl -X PURGE "$url"
          done
