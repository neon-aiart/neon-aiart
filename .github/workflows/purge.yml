name: 🗑️ Auto Camo Purge
on:
  workflow_dispatch:

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Purge Cache
        uses: koki-develop/hub-purge-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # repository指定はやめて、URLを直接書く！
          # これなら「解析」を飛ばして、直接GitHubに命令を飛ばせるよ
          urls: |
            [https://random-image.neon-aiillust.workers.dev/](https://random-image.neon-aiillust.workers.dev/)
