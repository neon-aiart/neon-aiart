name: 🗑️ Auto Camo Purge
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *' # ５分おき

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      # 1. まずリポジトリの中身（README.md）をランナーに持ってくる！
      # - uses: actions/checkout@v4

      # 2. その持ってきた README.md を解析してパージする！
      - name: Purge Cache
        uses: koki-develop/hub-purge-action@c608e39abca23026c802f44643cffccc123a826f # v1.0.3
        with:
          repository: neon-aiart/neon-aiart

      - name: Purge Worker Cache
        run: |
          # あなたのWorkerのURLをCamoのハッシュに変換して消去を依頼する
          TARGET_URLS=(
            "https://random-image.neon-aiillust.workers.dev/"
            "https://image-cache.neon-aiillust.workers.dev/"
          )

          for url in "${TARGET_URLS[@]}"; do
            echo "Purging: $url"
            
            # 1. URLからハッシュ(SHA1)を計算
            # 余計な文字を排除して純粋なハッシュ値だけを抽出します
            HASH=$(echo -n "$url" | openssl sha1 | sed 's/^.* //')
            
            # 2. GitHub Camoの公式パージURLを叩く
            # エラー(Malformed)を防ぐため、URLをダブルクォートでしっかり囲みます
            curl -X PURGE "camo.githubusercontent.com{HASH}" || echo "Failed to purge $url"
          done
