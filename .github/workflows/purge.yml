name: 🗑️ Auto Camo Purge
on:
  workflow_dispatch:

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Purge Cache
        uses: koki-develop/hub-purge-action@v1
        env:
          # ここ！with の中じゃなくて env に書くのが正解だよ
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          repository: neon-aiart/neon-aiart
          path: README.md
